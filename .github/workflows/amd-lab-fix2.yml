name: AMD lab renderer with patches v2
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Renderer commit to build
        default: 3e2b8d76d2c38b5da09aadf5b8be7ff76d7f6d64
      patch:
        description: Patch in patches/ to apply
        default: amd-msaa-depth.patch
      diagnostics:
        description: SHADGT_DIAGNOSTICS (ON or OFF)
        default: 'ON'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: main
          path: lab-ctl
          sparse-checkout: patches
      - name: Apply patch
        shell: pwsh
        run: |
          git apply --verbose "lab-ctl/patches/${{ inputs.patch }}"
          if ($LASTEXITCODE) { throw 'Patch did not apply' }
          git diff --stat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build libSceVideoOut.prx
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Set-Location $env:GITHUB_WORKSPACE
          $tools = 'C:/t'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/clang%2Bllvm-23.1.3-x86_64-pc-windows-msvc.tar.xz' -OutFile "$tools/llvm.tar.xz"
          & "$env:ProgramFiles/7-Zip/7z.exe" x "$tools/llvm.tar.xz" "-o$tools" -y -bso0 -bsp0
          & "$env:ProgramFiles/7-Zip/7z.exe" x "$tools/llvm.tar" "-o$tools" -y -bso0 -bsp0
          $env:PATH = "$tools/clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin;$env:PATH"
          python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4
          $rc = (Get-Command rc.exe -CommandType Application).Source.Replace('\','/')
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER=lld-link "-DCMAKE_RC_COMPILER=$rc" -DSHADGT_RYTY_GPU=ON -DHAVE_ENDIAN_H=OFF -DENABLE_DISCORD_RPC=ON "-DSHADGT_DIAGNOSTICS=${{ inputs.diagnostics }}"
          if ($LASTEXITCODE) { throw 'CMake configure failed' }
          cmake --build build --target ryty_gpu --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-fix-${{ inputs.diagnostics }}
          path: build/**/libSceVideoOut.prx
          if-no-files-found: error
          retention-days: 7
